<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="ISO-8859-1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}" />
    <link rel="icon" type="images/x-icons" th:href="@{/icon.png}" />
</head>
<body>
    <section class="navbar">
        <a class="home-ref" th:href="@{/home}">
            <div class="navbar-icon">
                <img class="icon" th:src="@{/icon.png}"/>
                <h1>WATCH-LIST</h1>
            </div>
        </a>
        <div class="navbar-select">
            <a class="navbar-select-opt" th:href="@{/home}">HOME</a>
            <a class="navbar-select-opt" th:href="@{/mine}">MY MOVIES</a>
            <a class="navbar-select-opt" th:href="@{/add}">REGISTER NEW MOVIE</a>
        </div>
    </section>  
    <section class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#ID</th>
                    <th>MOVIE NAME</th>
                    <th>DIRECTED BY</th>
                    <th>RELEASED ON</th>
                    <th>ADD</th>
                    <th>UPDATE</th>
                    <th>DELETE</th>        
                </tr>    
            </thead>
            <tbody>
                <tr th:each="w : ${watchlist}">
                    <td th:text="${w.id}"></td>
                    <td th:text="${w.mname}"></td>
                    <td th:text="${w.dname}"></td>
                    <td th:text="${w.year}"></td>                    
                    <td><a th:href="@{/mine/add/{id}(id=${w.id})}"><img src="add.png"/></a></td>
                    <td><a th:href="@{/all/update/{id}(id=${w.id})}"><img src="update.png" /></a></td>
                    <td><a th:href="@{/all/delete/{id}(id=${w.id})}" onclick="return confirm('are you sure?')"><img src="delete.png" /></a></td>
                </tr>
            </tbody>
        </table>
    </section>  
</body>
</html>
